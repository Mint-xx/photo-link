<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 · 登录</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  /* 所有按钮/链接点击时不要蓝色高亮和聚焦框 */
  button, a, input, .dot, .copy-btn, .gen-btn, .view-trigger,
  .modal-btn, .download-btn, .modal-close {
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  button:focus, a:focus, input:focus,
  .dot:focus, .copy-btn:focus, .gen-btn:focus, .view-trigger:focus,
  .modal-btn:focus, .download-btn:focus, .modal-close:focus {
    outline: none;
    box-shadow: none;
  }
  /* 但输入框保留聚焦时的边框提示 */
  input:focus {
    outline: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #0b0b0c;
    color: #eaeaea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: #16171a;
    border: 1px solid #26282d;
    border-radius: 18px;
    padding: 36px 32px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 20px 60px -20px #000;
  }

  .icon {
    font-size: 40px;
    margin-bottom: 14px;
    display: inline-block;
    animation: floatY 3s ease-in-out infinite;
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }

  h1 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  p { color: #8a8a8a; font-size: 13px; margin: 0 0 24px; }

  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #33353b;
    background: #0e0f11;
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: border-color .15s;
    font-family: inherit;
    text-align: center;
    letter-spacing: 2px;
  }
  input[type="password"]:focus { border-color: #6366f1; }

  button {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 0.5px;
    font-family: inherit;
  }
  button:hover { opacity: .92; }
  button:active { transform: scale(0.99); }

  .err {
    color: #f87171;
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
  }

  .back {
    display: inline-block;
    margin-top: 20px;
    color: #6b7280;
    text-decoration: none;
    font-size: 13px;
  }
  .back:hover { color: #9ca3af; }
</style>
</head>
<body>

<div class="card">
  <div class="icon">🔐</div>
  <h1>管理后台</h1>
  <p>请输入管理员密码</p>

  <form method="POST" action="/admin">
    <input type="password" name="password" autofocus autocomplete="off" placeholder="••••••••">
    <button type="submit">进 入</button>
    <div class="err">{{ error or '' }}</div>
  </form>

  <a class="back" href="/">← 返回首页</a>
</div>

</body>
</html>
